        button {
            padding: 15px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 300px;
            font-size: 22px;
            margin: 10px 10px;
        }

        #buttonB {
            padding: 15px 20px;
            background-color: #f0b03b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 300px;
            font-size: 22px;
            margin: 10px 5px;
        }

        #buttonB:hover {
            background-color: #dda339;

        }

        button:hover {
            background-color: #45a049;
        }

        .hide {
            display: none;
        }

        #progressBar {
            width: 300px;
            height: 8px;
            background-color: #e2e2e2;
            border-radius: 100px;
            margin: 10px auto;
        }

        #progress {
            height: 100%;
            background-color: #ff8411;
            border-radius: 100px;
            width: 0%;
        }

        #wordDisplay {
            font-size: 120px;
        }

        select {
            width: 300px;
            font-size: 24px;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-color: white;
            border: 1px solid #ccc;
            padding-right: 30px;
            background-image: url('data:image/svg+xml;utf8,<svg fill="black" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5 -5z"></path></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
        }

        #scontent {
            padding: 100px 100px;
            background-color: #efefef;
            border-radius: 20px;
            margin: 30px 0;
            border: #e3e3e3 2px solid;
        }

        label {
            font-size: 24px;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgb(255, 255, 255);
            border-radius: 24px;
            width: 100%;
            max-width: 700px;
            padding: 30px 30px;
            border: #f87e4a 5px solid;
        }

        #footer {
            margin-top: 60px;
            color: #c5c4c4;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
        }

        #endPage h1 {
            font-size: 84px;
            margin: 0;
        }

        #endPage p {
            font-size: 34px;
            margin: 30px 0;
        }

        #emoji {
            font-size: 120px;
        }

        #setupPage {
            text-align: center;
        }

        #setupPage h1 {
            text-align: center;
        }

        #gamePage {
            text-align: center;
        }

        #endPage {
            text-align: center;
        }

        #timeLeft {
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>

        let timer;

        function startGame() {
            clearInterval(timer);
            isGameOver = false;
            timeLimit = parseInt(document.getElementById('timeLimit').value);
            wordCount = parseInt(document.getElementById('wordCount').value);
            wordCategory = document.getElementById('wordCategory').value;

            document.getElementById('setupPage').classList.add('hide');
            document.getElementById('gamePage').classList.remove('hide');

            currentWordIndex = 0;
            correctCount = 0;
            giveUpCount = 0;
            loadWord();
            startTimer();
        }

        function loadWord() {
            const words = wordLists[wordCategory];
            if (currentWordIndex < wordCount) {
                const randomIndex = Math.floor(Math.random() * words.length);
                document.getElementById('wordDisplay').textContent = words[randomIndex];
            } else {
                endGame();
            }
        }

        function startTimer() {
            let timeLeft = timeLimit;
            progress = document.getElementById('progress');
            progress.style.width = '0%';
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timeLeft').textContent = '剩 ' + timeLeft + ' 秒';
                progress.style.width = ((timeLimit - timeLeft) / timeLimit * 100) + '%';

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    if (!isGameOver) {
                        giveUp();
                    }
                }
            }, 1000);
        }

        function answerCorrect() {
            clearInterval(timer);
            correctCount++;
            currentWordIndex++;
            loadWord();
            startTimer();
        }

        function giveUp() {
            if (!isGameOver) {
                clearInterval(timer);
                giveUpCount++;
                currentWordIndex++;
                loadWord();
                startTimer();
            }
        }

        function endGame() {
            clearInterval(timer);
            isGameOver = true;
            document.getElementById('gamePage').classList.add('hide');
            document.getElementById('endPage').classList.remove('hide');

            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('giveUpCount').textContent = giveUpCount;
        }

        function startNewGame() {
            clearInterval(timer);
            document.getElementById('endPage').classList.add('hide');
            document.getElementById('setupPage').classList.remove('hide');
            currentWordIndex = 0;
            correctCount = 0;
            giveUpCount = 0;
            isGameOver = false;
        }
